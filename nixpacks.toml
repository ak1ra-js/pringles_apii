# Konfigurasi Nixpacks untuk Server PHP di Railway

[phases.setup]
# Railway akan menginstall PHP dan membaca composer.json secara otomatis
nixPkgs = ["php82", "php82Packages.composer"]

[phases.build]
# Jika ada library tambahan, akan diinstall di sini
cmds = ["composer install --no-interaction --prefer-dist --optimize-autoloader"]

[start]
# Server Railway otomatis menggunakan Caddy/Nginx, tidak perlu diubah.
# File ini dibiarkan ada sebagai tanda untuk Nixpacks.
